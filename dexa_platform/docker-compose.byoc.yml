# BYOC: run the whole Dexa stack in your own cloud. Screenshots never leave your network.
#   docker compose -f docker-compose.byoc.yml up
# Requires an NVIDIA GPU (A100/H100-80GB) with the container toolkit installed.
#
# The backend flags mirror serve/cua_backend.py exactly. Pin the vLLM image tag to match
# (0.24.0); newer images keep `vllm serve` on PATH as the entrypoint used below.
services:
  backend:
    image: vllm/vllm-openai:v0.24.0
    entrypoint: ["vllm", "serve"]
    command:
      - Qwen/Qwen2.5-VL-7B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --served-model-name=dexa-cua-vlm
      - --max-model-len=16384
      - --gpu-memory-utilization=0.92
      - --enable-prefix-caching
      - --limit-mm-per-prompt={"image": 3}
      - --mm-processor-kwargs={"max_pixels": 1050000}
    environment:
      - HF_HUB_DISABLE_XET=1
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 30

  gateway:
    build: .
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - DEXA_BACKEND_URL=http://backend:8000
      - DEXA_BACKEND_MODEL=dexa-cua-vlm
      - DEXA_MODE=byoc
      - DEXA_API_KEY=${DEXA_API_KEY:-byoc-demo-key}
      - DEXA_REQUIRE_AUTH=1
    ports:
      - "8080:8080"

volumes:
  hf-cache:
